<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Arcade</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
        }

        /* ゲーム選択メニューのスタイル */
        #menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 20px;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 3rem;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1px);
            grid-auto-columns: minmax(200px, auto);
            gap: 20px;
            max-width: 500px;
            width: 100%;
        }

        /* 縦横2列に綺麗に並べるためのレスポンシブ設定 */
        @media (min-width: 500px) {
            .game-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .game-button {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #222, #333);
            border: 2px solid #444;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .game-button:hover {
            background: linear-gradient(145deg, #0056b3, #007bff);
            border-color: #00a2ff;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,123,255,0.4);
        }

        /* ゲーム画面（iframe）と戻るボタンのスタイル */
        #game-container {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        #back-button {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 10px 15px;
            font-size: 0.9rem;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
            z-index: 9999;
            transition: background 0.2s;
        }

        #back-button:hover {
            background-color: rgba(255, 0, 0, 0.8);
            border-color: #ff4d4d;
        }
    </style>
</head>
<body>

    <div id="menu-container">
        <h1>GAME MENU</h1>
        <div class="game-grid">
            <div class="game-button" onclick="launchGame('yohoho-io')">Yohoho.io</div>
            <div class="game-button" onclick="launchGame('poly-track')">Poly Track</div>
            <div class="game-button" onclick="launchGame('subway-surfers')">Subway Surfers</div>
            <div class="game-button" onclick="launchGame('table-tennis')">Table Tennis</div>
        </div>
    </div>

    <div id="game-container">
        <button id="back-button" onclick="closeGame()">メニューに戻る</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        const menuContainer = document.getElementById('menu-container');
        const gameContainer = document.getElementById('game-container');
        const gameFrame = document.getElementById('game-frame');

        // ゲームを起動する関数
        function launchGame(gameKey) {
            // メニューを隠してゲーム画面を表示
            menuContainer.style.display = 'none';
            gameContainer.style.display = 'block';
            
            // サーバーのゲーム用ルーティングURLをiframeにセットして読み込む
            gameFrame.src = `/${gameKey}/index.html`;
        }

        // メニューに戻る関数
        function closeGame() {
            // iframeの読み込みを解除
            gameFrame.src = '';
            
            // 表示を切り替える
            gameContainer.style.display = 'none';
            menuContainer.style.display = 'flex';
        }
    </script>
</body>
</html>
